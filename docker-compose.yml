name: libro-app

services:
  postgres:
    container_name: libro-app-postgres
    build:
      context: ./docker/postgres
    image: libro-app-postgres:dev
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    container_name: libro-app-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    image: libro-app-api:dev
    init: true
    env_file:
      - path: .env
        required: true
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MEDIA_LOCAL_ROOT: /app/apps/api/storage/media
    volumes:
      - media:/app/apps/api/storage/media
      - ./apps/api/src:/app/apps/api/src:ro
      - ./packages/tree-engine/src:/app/packages/tree-engine/src:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json:ro
      - ./apps/api/tsconfig.build.json:/app/apps/api/tsconfig.build.json:ro
      - ./apps/api/nest-cli.json:/app/apps/api/nest-cli.json:ro
    ports:
      - '127.0.0.1:${API_PORT:-3000}:${PORT:-3000}'
      - '127.0.0.1:${API_DEBUG_PORT:-9229}:9229'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - 'fetch(`http://127.0.0.1:$${process.env.PORT}/health`).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    develop:
      watch:
        - action: restart
          path: ./tsconfig.base.json
        - action: restart
          path: ./apps/api/tsconfig.json
        - action: restart
          path: ./apps/api/tsconfig.build.json
        - action: restart
          path: ./apps/api/nest-cli.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./packages/tree-engine/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  pgdata:
    name: libro-app-pgdata
  media:
    name: libro-app-media
